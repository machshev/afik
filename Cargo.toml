[workspace]
resolver = "2"
members = [
    "crates/radio-domain",
    "crates/radio-bk4819",
    "crates/radio-firmware-dp32g030",
    "crates/radio-channel-plan",
    "crates/radio-channel-control",
    "crates/radio-storage",
    "crates/radio-tx-policy",
    "crates/radio-ui",
    "crates/radio-protocol",
    "crates/radio-programmer",
    "crates/radio-programmer-cli",
    "crates/radio-programmer-serial",
    "crates/radio-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/machshev/afik"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
