name: pages

# Publishes the browser Studio (ADR-119) to GitHub Pages from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.0
      - name: Fetch crates for the offline K1 build
        run: nix develop path:. -c cargo fetch --locked
      # The Flash tab offers these as each family's packaged image.
      - name: Build the K5 and K1 images
        run: |
          nix develop path:. -c tool/build-k5.sh --release
          nix develop path:. -c tool/build-k1.sh --release
      - name: Build the browser Studio
        # trunk, wasm-bindgen-cli and binaryen come from the devshell, so the
        # wasm-bindgen CLI matches Cargo.lock.
        working-directory: crates/radio-programmer-gui
        run: >
          nix develop path:../.. -c
          trunk build --release --offline=true --locked=true
          --dist "${{ github.workspace }}/dist"
          --public-url "/${{ github.event.repository.name }}/"
      - name: Publish the images beside the Studio
        run: |
          mkdir dist/images
          cp target/thumbv6m-none-eabi/release/afik-k5-v1.raw \
            target/thumbv6m-none-eabi/release/radio-firmware-k1.raw dist/images/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
