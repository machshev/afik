name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        # The toolchain named in rust-toolchain.toml, which is the devshell's.
        run: |
          rustup toolchain install
          rustup target add thumbv6m-none-eabi wasm32-unknown-unknown
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Shared crates build for the browser
        # Studio's browser build (ADR-119) shares these crates unchanged.
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown
          -p radio-domain -p radio-protocol -p radio-programmer
          -p radio-channel-plan -p radio-storage -p radio-tx-policy
          -p radio-platform -p radio-flasher -p radio-sim
          -- -D warnings

  target-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.0
      - name: Evaluate locked environment
        run: nix flake check path:. --no-build
      - name: Fetch crates for the offline K1 build
        run: nix develop path:. -c cargo fetch --locked
      - name: Build, verify and package K5 image
        run: nix develop path:. -c tool/build-k5.sh --release
      - name: Build, verify and package K1 image
        run: |
          nix develop path:. -c tool/build-k1.sh --release
          nix develop path:. -c tool/test-k1-image.sh
