name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --component clippy,rustfmt --target thumbv6m-none-eabi
      - name: Formatting
        run: cargo +1.86.0 fmt --all --check
      - name: Clippy
        run: cargo +1.86.0 clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.86.0 test --workspace

  target-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.0
      - name: Evaluate locked environment
        run: nix flake check path:. --no-build
      - name: Build, verify and package K5 image
        run: nix develop path:. -c tool/build-k5.sh --release
      - name: Build, verify and package K1 image
        run: |
          nix develop path:. -c tool/build-k1.sh --release
          nix develop path:. -c tool/test-k1-image.sh
