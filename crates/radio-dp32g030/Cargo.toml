[package]
name = "radio-dp32g030"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Evidence-backed DP32G030 register drivers for the UV-K5 V1 target"

[lib]
path = "src/lib.rs"

[features]
# The Embassy time driver on SysTick; the image routes the SysTick vector to it.
# It counts millisecond periods, so Embassy ticks at 1 kHz.
time-driver = [
    "dep:critical-section",
    "dep:embassy-time-driver",
    "embassy-time-driver/tick-hz-1_000",
    "dep:embassy-time-queue-utils",
]

[dependencies]
critical-section = { version = "=1.2.0", optional = true }
embassy-time-driver = { version = "=0.2.2", optional = true }
embassy-time-queue-utils = { version = "=0.3.2", optional = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
