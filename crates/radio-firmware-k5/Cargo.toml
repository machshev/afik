[package]
name = "radio-firmware-k5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UV-K5 V1 (DP32G030) drivers and image for the shared AFIK application"
autobins = false

[lib]
path = "src/lib.rs"

[features]
# Builds only the memory routine emulator test.
mem-test = []
firmware = [
    "dep:cortex-m",
    "dep:embassy-executor",
    "dep:embassy-time",
    "radio-dp32g030/time-driver",
]

[dependencies]
radio-app = { path = "../radio-app" }
radio-bk1080 = { path = "../radio-bk1080" }
radio-bk4819 = { path = "../radio-bk4819" }
radio-domain = { path = "../radio-domain" }
radio-dp32g030 = { path = "../radio-dp32g030" }
radio-platform = { path = "../radio-platform" }
radio-tx-policy = { path = "../radio-tx-policy" }
# The same pinned Embassy the K1 runs; cortex-m supplies the single-core
# critical section the time driver and executor use.
cortex-m = { version = "=0.7.8", features = ["critical-section-single-core"], optional = true }
embassy-executor = { version = "=0.10.0", default-features = false, features = ["executor-thread", "platform-cortex-m"], optional = true }
embassy-time = { version = "=0.5.1", default-features = false, optional = true }

[dev-dependencies]
radio-flasher = { path = "../radio-flasher" }

[[bin]]
name = "radio-firmware-k5"
path = "src/main.rs"
required-features = ["firmware"]
test = false

# Runs the image's memory routines under `qemu-arm` (`tool/test-k5-mem.sh`).
[[bin]]
name = "k5-mem-test"
path = "src/bin/mem_test.rs"
required-features = ["mem-test"]
test = false
bench = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
