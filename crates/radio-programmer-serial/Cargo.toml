[package]
name = "radio-programmer-serial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform serial byte transport for AFIK programmer front ends"

[dependencies]
radio-programmer = { path = "../radio-programmer" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# No libudev: Linux discovery reads /dev itself, so the binaries need no
# system library and the port is opened by path on every platform.
serialport = { version = "4.10", default-features = false }

[lints]
workspace = true
