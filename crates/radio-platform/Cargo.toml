[package]
name = "radio-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware-independent AFIK application platform contracts"

[dependencies]
radio-bk4819 = { path = "../radio-bk4819" }
radio-channel-plan = { path = "../radio-channel-plan" }
radio-domain = { path = "../radio-domain" }
radio-tx-policy = { path = "../radio-tx-policy" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads better than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
