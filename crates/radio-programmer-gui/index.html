<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFIK Studio</title>
    <!-- The same Studio as the desktop binary, built for the browser (ADR-119). -->
    <link data-trunk rel="rust" data-bin="afik-studio" data-wasm-opt="2" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="afik_studio"></canvas>
  </body>
</html>
