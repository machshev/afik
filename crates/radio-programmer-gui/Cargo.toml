[package]
name = "radio-programmer-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native cross-platform AFIK channel, configuration, and flashing editor"

[[bin]]
name = "afik-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Decodes OpenStreetMap tiles for the Map tab.
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
radio-channel-plan = { path = "../radio-channel-plan" }
radio-domain = { path = "../radio-domain" }
radio-flasher = { path = "../radio-flasher" }
radio-platform = { path = "../radio-platform" }
radio-programmer = { path = "../radio-programmer" }
radio-programmer-serial = { path = "../radio-programmer-serial" }
radio-sim = { path = "../radio-sim" }
radio-storage = { path = "../radio-storage" }
radio-tx-policy = { path = "../radio-tx-policy" }
serde_json = "1"
# `std::time::Instant` and `SystemTime` panic in the browser; these do not.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Fetches the satellite list from SatNOGS; rustls, so no system TLS library.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# The browser Studio (`ADR-119`): Web Serial, fetch and the page's storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Document",
    "HtmlCanvasElement",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Request",
    "RequestInit",
    "Response",
    "Serial",
    "SerialOptions",
    "SerialPort",
    "SerialPortInfo",
    "SerialPortRequestOptions",
    "Storage",
    "Window",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }

[lints]
workspace = true
