[package]
name = "radio-firmware-k1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal evidence-backed UV-K1 serial witness application"
autobins = false

[lib]
path = "src/lib.rs"

[features]
firmware = []
embassy-runtime = ["dep:embassy-executor"]

[dependencies]
embassy-executor = { version = "=0.10.0", default-features = false, features = ["executor-thread", "platform-cortex-m"], optional = true }

[[bin]]
name = "radio-firmware-k1"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
