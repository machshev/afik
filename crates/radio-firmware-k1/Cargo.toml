[package]
name = "radio-firmware-k1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal evidence-backed UV-K1 serial witness application"
autobins = false

[lib]
path = "src/lib.rs"

[features]
firmware = []
embassy-runtime = ["dep:embassy-executor"]
py32f071-hal-inventory = ["dep:py32-hal"]
py32f071-clock-handoff = ["py32f071-hal-inventory"]
py32f071-clock-publication = ["py32f071-clock-handoff"]
py32f071-time-driver = [
    "py32f071-hal-inventory",
    "py32-hal/rt",
    "py32-hal/time-driver-tim15",
]
py32f071-usart1 = [
    "py32f071-hal-inventory",
    "py32-hal/rt",
]
py32f071-spi1 = ["py32f071-hal-inventory"]
py32f071-eeprom = ["py32f071-hal-inventory", "dep:embassy-time"]
py32f071-bk4819 = ["py32f071-hal-inventory", "dep:cortex-m"]
py32f071-runtime-composition = [
    "embassy-runtime",
    "py32f071-usart1",
    "py32f071-spi1",
]
py32f071-runtime-init = [
    "py32f071-clock-publication",
    "py32f071-time-driver",
    "py32f071-runtime-composition",
]
async-firmware = [
    "py32f071-runtime-init",
    "py32f071-bk4819",
    "py32f071-eeprom",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:cortex-m-rt",
    "dep:cortex-m",
    "py32-hal/memory-x",
]

[dependencies]
radio-bk4819 = { path = "../radio-bk4819" }
radio-channel-control = { path = "../radio-channel-control" }
radio-channel-plan = { path = "../radio-channel-plan" }
radio-device = { path = "../radio-device" }
radio-protocol = { path = "../radio-protocol" }
radio-eeprom = { path = "../radio-eeprom" }
radio-storage = { path = "../radio-storage" }
radio-domain = { path = "../radio-domain" }
embassy-executor = { version = "=0.10.0", default-features = false, features = ["executor-thread", "platform-cortex-m"], optional = true }
py32-hal = { version = "=0.4.1", default-features = false, features = ["py32f071r1b"], optional = true }
embassy-time = { version = "=0.5.1", default-features = false, optional = true }
embassy-sync = { version = "=0.7.2", default-features = false, optional = true }
cortex-m-rt = { version = "=0.7.6", optional = true }
cortex-m = { version = "=0.7.8", optional = true }

[dev-dependencies]
radio-programmer = { path = "../radio-programmer" }

[[bin]]
name = "radio-firmware-k1"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[[bin]]
name = "radio-firmware-k1-async"
path = "src/async_main.rs"
required-features = ["async-firmware"]
test = false
bench = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
